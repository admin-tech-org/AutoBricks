[project]
name = "autobricks"
version = "0.1.0"
description = "AutoBricks 共用工具：檢查 Bricks 模板 JSON 與擷取元素 schema；Agent 產品依 skills 觀察原站並重建網頁"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
# 開發用工具（uv sync 會自動安裝 dev 群組）
dev = ["ruff>=0.6"]

[tool.uv]
# 平面腳本、非安裝套件——uv 只管 venv + deps，不建置本專案
package = false

[tool.ruff]
target-version = "py310"
line-length = 120
