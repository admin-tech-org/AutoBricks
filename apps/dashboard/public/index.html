<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bricks CDP Visual Generator</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f19;
      color: #e5e7eb;
      font-size: 14px;
      line-height: 1.5;
    }
    #root { height: 100%; }
    a { color: #635bff; }
    input, select, textarea, button {
      font: inherit;
      color: #e5e7eb;
      background: #111827;
      border: 1px solid #273047;
      border-radius: 6px;
      padding: 7px 10px;
    }
    input:focus, select:focus, textarea:focus { outline: 1px solid #635bff; }
    button { cursor: pointer; }
    button.primary { background: #635bff; border-color: #635bff; color: #fff; font-weight: 600; }
    button.primary:disabled { opacity: 0.5; cursor: default; }
    button.tab { background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 12px; color: #9ca3af; }
    button.tab.active { color: #e5e7eb; border-bottom-color: #635bff; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #273047; border-radius: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/bundle.js"></script>
</body>
</html>
